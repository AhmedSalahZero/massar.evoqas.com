<!DOCTYPE html>
<html lang="en" dir="ltr" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Massar · Dashboard demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<!--
  Massar — Dashboard demo (for agreement, Step 15)
  One self-contained page: open it in any browser. Sample numbers for the
  workspace; the Egypt market wages and outlook are the real figures of the
  Egypt Occupational Outlook already in Massar's backbone.
  Buttons at the top: English / عربي · light / dark · date range ·
  Partner workspace / Super Admin.
-->
<style>
/* ── Massar tokens (from the design system app.css v1.0) ─────────────── */
:root{
  --ms-bg:#0C1829; --ms-bg-header:#0E1E34; --ms-bg-card:#112240; --ms-bg-hover:#163050; --ms-bg-input:#0F1F3A;
  --ms-border:#21518B; --ms-border-soft:#1A3A64; --ms-text-primary:#F1F5F9; --ms-text-muted:#7E93AE; --ms-text-label:#FFFFFF;
  --ms-navy:#3E82D6; --ms-navy-dim:rgba(62,130,214,.12); --ms-navy-border:rgba(62,130,214,.25);
  --ms-green:#26C08C; --ms-green-dim:rgba(38,192,140,.12); --ms-green-border:rgba(38,192,140,.25);
  --ms-orange:#E08A3C; --ms-orange-dim:rgba(224,138,60,.12); --ms-orange-border:rgba(224,138,60,.25);
  --ms-purple:#C264A8; --ms-purple-dim:rgba(194,100,168,.12); --ms-purple-border:rgba(194,100,168,.25);
  --ms-teal:#1490A8; --ms-teal-dim:rgba(20,144,168,.14); --ms-teal-border:rgba(20,144,168,.30);
  --ms-gold:#BA7517; --ms-danger:#F87171; --ms-danger-dim:rgba(248,113,113,.10); --ms-danger-border:rgba(248,113,113,.25);
  --ms-brand-grad:linear-gradient(135deg,var(--ms-navy),var(--ms-green));
  --ms-shadow:0 4px 24px rgba(0,0,0,.5);
  /* chart roles (validated: 4 slots, light + dark) */
  --s1:#3e82d6; --s2:#d95926; --s3:#199e70; --s4:#c264a8;
  --grid:rgba(126,147,174,.18); --axis:#7E93AE;
  --font:'Inter','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html.light{
  --ms-bg:#EFF6FC; --ms-bg-header:#FFFFFF; --ms-bg-card:#FFFFFF; --ms-bg-hover:#E8F3FA; --ms-bg-input:#F2F8FC;
  --ms-border:#D7E6F2; --ms-border-soft:#E4EEF6; --ms-text-primary:#123055; --ms-text-muted:#5C7999; --ms-text-label:#1B4F8C;
  --ms-navy:#1B4F8C; --ms-navy-dim:rgba(27,79,140,.08); --ms-navy-border:rgba(27,79,140,.20);
  --ms-green:#1E7A5C; --ms-green-dim:rgba(30,122,92,.08); --ms-green-border:rgba(30,122,92,.22);
  --ms-orange:#C1560C; --ms-orange-dim:rgba(193,86,12,.08); --ms-orange-border:rgba(193,86,12,.22);
  --ms-purple:#8E2A63; --ms-purple-dim:rgba(142,42,99,.08); --ms-purple-border:rgba(142,42,99,.22);
  --ms-teal:#16708A; --ms-teal-dim:rgba(22,112,138,.09); --ms-teal-border:rgba(22,112,138,.24);
  --ms-danger:#C0392B; --ms-danger-dim:rgba(192,57,43,.07); --ms-danger-border:rgba(192,57,43,.20);
  --ms-shadow:0 4px 24px rgba(27,79,140,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#b0508f;
  --grid:rgba(92,121,153,.16); --axis:#5C7999;
  color-scheme:light;
}
html[lang=ar]{ --font:'Tajawal','Inter',system-ui,'Segoe UI',Tahoma,sans-serif; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--ms-bg); color:var(--ms-text-primary); font-family:var(--font); font-size:14px; line-height:1.45; }
a{ color:var(--ms-navy); text-decoration:none; font-weight:600; }
button{ font:inherit; color:inherit; }
.num{ font-variant-numeric:tabular-nums; }

/* ── Shell ───────────────────────────────────────────────────────────── */
.app{ display:grid; grid-template-columns:236px 1fr; min-height:100vh; }
.side{ background:var(--ms-bg-header); border-inline-end:1px solid var(--ms-border); padding:16px 12px; position:sticky; top:0; height:100vh; overflow:auto; }
.brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; padding:4px 6px 16px; }
.brand i{ width:34px; height:34px; border-radius:10px; background:var(--ms-brand-grad); display:grid; place-items:center; color:#fff; font-style:normal; }
.nav-label{ font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ms-text-muted); margin:14px 8px 6px; }
.nav a{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; color:var(--ms-text-primary); font-weight:600; font-size:13.5px; }
.nav a.on{ background:var(--ms-navy-dim); color:var(--ms-navy); }
.nav a .soon{ margin-inline-start:auto; font-size:10px; border:1px solid var(--ms-border); border-radius:99px; padding:0 7px; color:var(--ms-text-muted); }
.main{ min-width:0; }
.top{ height:60px; display:flex; align-items:center; gap:10px; padding:0 22px; background:var(--ms-bg-header); border-bottom:1px solid var(--ms-border); position:sticky; top:0; z-index:5; }
.top .ws{ font-weight:800; }
.top .grow{ flex:1; }
.seg{ display:inline-flex; border:1px solid var(--ms-border); border-radius:9px; overflow:hidden; background:var(--ms-bg-card); }
.seg button{ border:0; background:none; padding:6px 11px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ms-text-muted); }
.seg button[aria-pressed=true]{ background:var(--ms-navy); color:#fff; }
.icon-btn{ border:1px solid var(--ms-border); background:var(--ms-bg-card); border-radius:9px; width:34px; height:34px; cursor:pointer; }
.demo-note{ background:var(--ms-gold); color:#fff; text-align:center; font-size:12px; font-weight:700; padding:5px 10px; }
.content{ padding:22px 26px 60px; max-width:1400px; }

/* ── Page chrome ─────────────────────────────────────────────────────── */
.page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.eyebrow{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ms-teal); }
h1{ margin:2px 0 2px; font-size:26px; font-weight:800; }
.sub{ color:var(--ms-text-muted); font-size:13px; }
.btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--ms-border); background:var(--ms-bg-card); border-radius:9px; padding:7px 13px; font-weight:700; font-size:13px; cursor:pointer; color:var(--ms-text-primary); }
.btn.primary{ background:var(--ms-navy); border-color:var(--ms-navy); color:#fff; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--ms-border); margin-bottom:18px; }
.tabs button{ border:0; background:none; padding:9px 14px; font-weight:700; cursor:pointer; color:var(--ms-text-muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
.tabs button[aria-pressed=true]{ color:var(--ms-navy); border-color:var(--ms-navy); }
.section-label{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ms-orange); margin:26px 0 10px; }

/* ── Cards ───────────────────────────────────────────────────────────── */
.grid{ display:grid; gap:14px; }
.g5{ grid-template-columns:repeat(5,minmax(0,1fr)); }
.g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.g32{ grid-template-columns:minmax(0,2fr) minmax(0,1fr); }
.panel{ background:var(--ms-bg-card); border:1px solid var(--ms-border); border-radius:13px; padding:16px 18px; min-width:0; }
.panel-h{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; }
.panel h3{ margin:0; font-size:14.5px; font-weight:800; }
.panel .hint{ font-size:12px; color:var(--ms-text-muted); margin-top:2px; }
.linkbtn{ border:0; background:none; color:var(--ms-navy); font-weight:700; font-size:12px; cursor:pointer; padding:0; white-space:nowrap; }
.stat{ position:relative; overflow:hidden; }
.stat::before{ content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px; background:var(--accent,var(--ms-navy)); }
.stat .lbl{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent,var(--ms-navy)); }
.stat .val{ font-size:28px; font-weight:800; margin:4px 0 2px; }
.stat .foot{ font-size:12px; color:var(--ms-text-muted); }
.stat svg{ display:block; margin-top:8px; }
.delta{ font-weight:800; font-size:12px; }
.delta.up{ color:var(--ms-green); } .delta.down{ color:var(--ms-danger); }
.badge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:2px 8px; border-radius:99px; border:1px solid var(--ms-border); color:var(--ms-text-muted); white-space:nowrap; }
.badge.green{ color:var(--ms-green); border-color:var(--ms-green-border); background:var(--ms-green-dim); }
.badge.orange{ color:var(--ms-orange); border-color:var(--ms-orange-border); background:var(--ms-orange-dim); }
.badge.danger{ color:var(--ms-danger); border-color:var(--ms-danger-border); background:var(--ms-danger-dim); }
.badge.navy{ color:var(--ms-navy); border-color:var(--ms-navy-border); background:var(--ms-navy-dim); }
.badge.teal{ color:var(--ms-teal); border-color:var(--ms-teal-border); background:var(--ms-teal-dim); }
.mute{ color:var(--ms-text-muted); } .small{ font-size:12.5px; } .xsmall{ font-size:11.5px; }

/* ── Funnel ──────────────────────────────────────────────────────────── */
.funnel{ display:grid; gap:10px; }
.frow{ display:grid; grid-template-columns:130px 1fr 150px; gap:12px; align-items:center; }
.frow .nm{ font-weight:700; font-size:13px; }
.frow .nm small{ display:block; font-weight:500; color:var(--ms-text-muted); font-size:11.5px; }
.ftrack{ height:26px; background:var(--ms-bg-hover); border-radius:6px; overflow:hidden; }
.ftrack i{ display:block; height:100%; border-radius:0 4px 4px 0; background:var(--s1); }
[dir=rtl] .ftrack i{ border-radius:4px 0 0 4px; }
.frow .fv{ text-align:end; font-weight:800; }
.frow .fv small{ display:block; font-weight:600; color:var(--ms-text-muted); font-size:11.5px; }

/* ── Horizontal bars ─────────────────────────────────────────────────── */
.hbars .r{ display:grid; grid-template-columns:minmax(110px,1.2fr) 2fr 58px; gap:10px; align-items:center; padding:5px 0; font-size:12.5px; }
.hbars .r > span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hbars .trk{ height:10px; border-radius:5px; background:var(--ms-bg-hover); overflow:hidden; }
.hbars .trk i{ display:block; height:100%; border-radius:0 4px 4px 0; background:var(--c,var(--s1)); }
[dir=rtl] .hbars .trk i{ border-radius:4px 0 0 4px; }
.hbars .v{ text-align:end; font-weight:800; font-variant-numeric:tabular-nums; }

/* ── SVG charts ──────────────────────────────────────────────────────── */
.chart{ width:100%; display:block; direction:ltr; }
.chart text{ fill:var(--axis); font-size:11px; font-family:var(--font); }
.chart .gl{ stroke:var(--grid); stroke-width:1; }
.chart .hit{ fill:transparent; cursor:crosshair; }
.chart .hl{ stroke:var(--axis); stroke-width:1; stroke-dasharray:3 3; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ms-text-muted); margin-top:8px; }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-inline-end:6px; vertical-align:-1px; }
.legend i.line{ height:3px; border-radius:2px; vertical-align:3px; }

/* ── Tables ──────────────────────────────────────────────────────────── */
.twrap{ overflow-x:auto; border:1px solid var(--ms-border); border-radius:11px; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:start; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ms-text-muted); padding:9px 12px; background:var(--ms-bg-hover); white-space:nowrap; }
td{ padding:9px 12px; border-top:1px solid var(--ms-border-soft); vertical-align:middle; }
td.n, th.n{ text-align:end; font-variant-numeric:tabular-nums; }
tbody tr:hover{ background:var(--ms-bg-hover); }
.meter{ height:6px; border-radius:3px; background:var(--ms-bg-hover); overflow:hidden; min-width:70px; }
.meter i{ display:block; height:100%; background:var(--c,var(--s1)); border-radius:3px; }
.code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:var(--ms-teal); font-weight:700; }
.tiny-bar{ display:inline-block; height:8px; border-radius:2px; background:var(--s1); vertical-align:middle; margin-inline-end:6px; }

/* ── Attention list ──────────────────────────────────────────────────── */
.att{ display:grid; gap:8px; }
.att a{ display:flex; gap:10px; align-items:center; padding:9px 10px; border-radius:9px; border:1px solid var(--ms-border); color:var(--ms-text-primary); font-weight:600; font-size:13px; }
.att a:hover{ background:var(--ms-bg-hover); }
.att .ic{ width:26px; height:26px; border-radius:8px; display:grid; place-items:center; font-weight:800; flex-shrink:0; }
.att .ic.warn{ background:var(--ms-orange-dim); color:var(--ms-orange); }
.att .ic.bad{ background:var(--ms-danger-dim); color:var(--ms-danger); }
.att .ic.info{ background:var(--ms-navy-dim); color:var(--ms-navy); }
.att b{ font-size:16px; margin-inline-start:auto; }

/* ── Split bar (gender) ──────────────────────────────────────────────── */
.split{ display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px; margin:10px 0 6px; }
.split i{ display:block; height:100%; }
.two{ display:flex; justify-content:space-between; font-size:12.5px; }
.two b{ font-size:18px; display:block; }

/* ── Tooltip ─────────────────────────────────────────────────────────── */
#tip{ position:fixed; z-index:50; pointer-events:none; background:var(--ms-bg-card); color:var(--ms-text-primary); border:1px solid var(--ms-border); box-shadow:var(--ms-shadow); border-radius:9px; padding:8px 10px; font-size:12px; min-width:120px; display:none; }
#tip .t{ font-weight:800; margin-bottom:4px; }
#tip .row{ display:flex; gap:8px; align-items:center; justify-content:space-between; }
#tip .row i{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-inline-end:6px; }

.agree{ border:1px dashed var(--ms-purple-border); background:var(--ms-purple-dim); border-radius:11px; padding:10px 14px; font-size:12.5px; margin-top:8px; }
.agree b{ color:var(--ms-purple); }

@media (max-width:1180px){ .g5{ grid-template-columns:repeat(3,minmax(0,1fr)); } .g32,.g2{ grid-template-columns:1fr; } }
@media (max-width:820px){ .app{ grid-template-columns:1fr; } .side{ display:none; } .g5{ grid-template-columns:repeat(2,minmax(0,1fr)); } .g4{ grid-template-columns:1fr; } .content{ padding:16px; } .frow{ grid-template-columns:90px 1fr 92px; } .top{ padding:0 12px; } .top .ws{ display:none; } }
@media print{ .side,.top,.demo-note,.tabs,.actions{ display:none !important; } .app{ display:block; } .panel{ break-inside:avoid; } }
</style>
</head>
<body>
<div class="demo-note" id="demoNote"></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <span class="ws" id="ws"></span><span class="mute small" id="crumb"></span>
      <span class="grow"></span>
      <div class="seg" id="langSeg"><button data-lang="en">EN</button><button data-lang="ar">عربي</button></div>
      <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="tip"></div>

<script>

const OPPS = [ // kind, title en, title ar, employer, seats, eligible, referred, seats taken, deadline, state

  ['job','Call centre agent (Arabic/English)','موظف مركز اتصال (عربي/إنجليزي)','Delta Telecom',15,61,22,9,'2026-10-30','open'],

// ── Charts ─────────────────────────────────────────────────────────
function stackedColumns(months, series, keys, colors, names) {
  const W0 = 640, H = 220, pl = 34, pr = 8, pt = 10, pb = 26;
  const totals = months.map((_, i) => sum(keys.map(k => series[k][i])));
  const max = Math.ceil(Math.max(...totals) / 50) * 50 || 10;
  const bw = (W0 - pl - pr) / months.length, barW = Math.min(30, bw * 0.62);
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line class="gl" x1="${pl}" x2="${W0-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`; }
  months.forEach((m, i) => {
    const x = pl + i * bw + (bw - barW) / 2; let base = 0;
    keys.forEach((k, j) => {
      const v = series[k][i]; if (!v) return;
      const y1 = y(base + v), y0 = y(base), top = j === keys.length - 1;
      const h = Math.max(0, y0 - y1 - (base ? 2 : 0));
      g += top ? `<path d="${roundTop(x, y1, barW, h, 4)}" fill="${colors[j]}"/>` : `<rect x="${x}" y="${y1}" width="${barW}" height="${h}" fill="${colors[j]}"/>`;
      base += v;
    });
    g += `<text x="${x+barW/2}" y="${H-8}" text-anchor="middle">${monthName(m)}</text>`;
    g += `<rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" ${tipAttr(monthName(m,true), keys.map((k,j)=>[colors[j], names[j], nf(series[k][i])]).concat([[null, t('total'), nf(totals[i])]]))}/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W0} ${H}" role="img">${g}</svg>`;
}
function roundTop(x, y, w, h, r) { r = Math.min(r, h, w/2); return `M${x},${y+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${y+h} Z`; }
function lines(months, series, keys, colors, names) {
  const W0 = 640, H = 220, pl = 34, pr = 12, pt = 12, pb = 26;
  const top0 = Math.max(...keys.flatMap(k => series[k])); const unit = top0 > 200 ? 200 : top0 > 40 ? 20 : 4; const max = Math.max(4, Math.ceil(top0 / unit) * unit);
  const step = (W0 - pl - pr) / Math.max(1, months.length - 1);
  const x = i => months.length === 1 ? (pl + W0 - pr) / 2 : pl + i * step, y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line class="gl" x1="${pl}" x2="${W0-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`; }
  keys.forEach((k, j) => {
    const pts = series[k].map((v, i) => `${x(i)},${y(v)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${colors[j]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lx = x(months.length - 1), lv = series[k][months.length - 1];
  });
  months.forEach((m, i) => {
    if (months.length <= 6 || i % 2 === 0 || i === months.length - 1) g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${monthName(m)}</text>`;
    const hw = months.length === 1 ? W0 : step;
    g += `<g class="hv"><line class="hl" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${H-pb}" style="display:none"/>${keys.map((k,j)=>`<circle cx="${x(i)}" cy="${y(series[k][i])}" r="4.5" fill="${colors[j]}" stroke="var(--ms-bg-card)" stroke-width="2" style="display:none"/>`).join('')}
      <rect class="hit" x="${x(i)-hw/2}" y="${pt}" width="${hw}" height="${H-pt-pb}" ${tipAttr(monthName(m,true), keys.map((k,j)=>[colors[j], names[j], nf(series[k][i])]))}/></g>`;
  });
  return `<svg class="chart lines" viewBox="0 0 ${W0} ${H}" role="img">${g}</svg>`;
}
function columns(items, color) {
  const W0 = 260, H = 210, pl = 30, pr = 4, pt = 10, pb = 24;
  const max = Math.ceil(Math.max(...items.map(i => i[1])) / 100) * 100;
  const bw = (W0 - pl - pr) / items.length, barW = Math.min(34, bw * 0.6), y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line class="gl" x1="${pl}" x2="${W0-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`; }
  items.forEach(([lbl, v], i) => {
    const x = pl + i * bw + (bw - barW) / 2;
    g += `<path d="${roundTop(x, y(v), barW, H - pb - y(v), 4)}" fill="${color}"/><text x="${x+barW/2}" y="${H-8}" text-anchor="middle">${lbl}</text>`;
    g += `<rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" ${tipAttr(`${t('age')} ${lbl}`, [[color, t('c_people'), nf(v)]])}/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W0} ${H}" role="img">${g}</svg>`;
}
function hbars(rows, color, fmt = v => nf(v)) {
  const max = Math.max(...rows.map(r => r[1]));
  return `<div class="hbars">${rows.map(([n, v]) => `<div class="r" ${tipAttr(n, [[color, t('c_people'), fmt(v)]])}><span title="${esc(n)}">${esc(n)}</span><span class="trk"><i style="width:${v/max*100}%;--c:${color}"></i></span><span class="v">${fmt(v)}</span></div>`).join('')}</div>`;
}
function dumbbell(rows) { // [label, expected, market]
  const W0 = 560, rowH = 30, pl = 200, pr = 26, pt = 8, H = pt + rows.length * rowH + 24;
  const max = 10000, x = v => pl + (W0 - pl - pr) * Math.min(v, max) / max;
  let g = '';
  [0, 2500, 5000, 7500, 10000].forEach(v => { g += `<line class="gl" x1="${x(v)}" x2="${x(v)}" y1="${pt}" y2="${H-22}"/><text x="${x(v)}" y="${H-6}" text-anchor="middle">${nf(v)}</text>`; });
  rows.forEach(([lbl, e, m], i) => {
    const cy = pt + i * rowH + rowH / 2;
    g += `<text x="${pl-10}" y="${cy+4}" text-anchor="end" style="fill:var(--ms-text-primary)">${esc(lbl.length > 30 ? lbl.slice(0, 29) + '…' : lbl)}</text>`;
    g += `<line x1="${x(e)}" x2="${x(m)}" y1="${cy}" y2="${cy}" stroke="var(--axis)" stroke-width="2" opacity=".45"/>`;
    g += `<circle cx="${x(m)}" cy="${cy}" r="6" fill="var(--s2)" stroke="var(--ms-bg-card)" stroke-width="2"/><circle cx="${x(e)}" cy="${cy}" r="6" fill="var(--s1)" stroke="var(--ms-bg-card)" stroke-width="2"/>`;
    g += `<rect class="hit" x="0" y="${cy-rowH/2}" width="${W0}" height="${rowH}" ${tipAttr(lbl, [['var(--s1)', t('sal_e'), nf(e)], ['var(--s2)', t('sal_m'), nf(m)], [null, t('c_gap'), (e>=m?'+':'−') + nf(Math.abs(e-m))]])}/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W0} ${H}" role="img">${g}</svg>`;
}
function spark(vals, color) {
  const w = 160, h = 30, max = Math.max(...vals), min = Math.min(...vals);
  const pts = vals.map((v, i) => `${(i/(vals.length-1))*w},${h-3-((v-min)/(max-min||1))*(h-6)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" height="30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function monthTable(months, series, keys, names) {
  return `<div class="twrap"><table><thead><tr><th>${t('month')}</th>${names.map(n=>`<th class="n">${n}</th>`).join('')}<th class="n">${t('total')}</th></tr></thead><tbody>${months.map((m,i)=>`<tr><td>${monthName(m,true)}</td>${keys.map(k=>`<td class="n">${nf(series[k][i])}</td>`).join('')}<td class="n"><b>${nf(sum(keys.map(k=>series[k][i])))}</b></td></tr>`).join('')}</tbody></table></div>`;
}
const cut = (obj) => Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, last(v)]));
const agree = (k) => `<div class="agree">${t('agree', { t: t(k) })}</div>`;

  else if (b.dataset.toggle) S.tables[b.dataset.toggle] = !S.tables[b.dataset.toggle];
  else if (b.id === 'themeBtn') S.theme = S.theme === 'light' ? 'dark' : 'light';
  else return;
  render();
});
// ── Tooltip (every bar, dot, stage and month) ──────────────────────
const tip = document.getElementById('tip');
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-tip]');
  document.querySelectorAll('.hv .hl, .hv circle').forEach(n => { n.style.display = 'none'; });
  if (!el) { tip.style.display = 'none'; return; }
  const hv = el.closest('.hv'); if (hv) hv.querySelectorAll('.hl, circle').forEach(n => { n.style.display = ''; });
  const d = JSON.parse(el.dataset.tip);
  tip.innerHTML = `<div class="t">${esc(d.title)}</div>` + d.rows.map(([c, n, v]) => `<div class="row"><span>${c?`<i style="background:${c}"></i>`:''}${esc(n)}</span><b class="num">${esc(v)}</b></div>`).join('');
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
render();
</script>
